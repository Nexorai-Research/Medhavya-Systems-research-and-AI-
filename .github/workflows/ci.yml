name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: medhavya, POSTGRES_PASSWORD: ci_only, POSTGRES_DB: medhavya }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medhavya" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://medhavya:ci_only@127.0.0.1:5432/medhavya
      PAYLOAD_SECRET: ci-only-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run cms:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
